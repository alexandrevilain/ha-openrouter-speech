[project]
name = "openrouter-speech"
version = "0.1.0"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff",
  "mypy",
  # requirements of the core tts component, loaded in tests
  "mutagen==1.48.1",
  "ha-ffmpeg==3.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "PL", "ASYNC", "PTH"]
ignore = ["D203", "D213", "E501", "PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR"]
"scripts/*" = ["D", "ASYNC"]  # standalone CLI, blocking file I/O is fine

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components", "scripts"]
